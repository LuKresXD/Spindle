# Spindle configuration
# Copy to config.yaml and fill in your API keys

acoustid:
  api_key: ""                              # optional: only read when fingerprint.acoustid_fallback is on
                                           # (https://acoustid.org/new-application)

spotify:
  client_id: "your-spotify-client-id"       # https://developer.spotify.com/dashboard
  client_secret: "your-spotify-client-secret"

lastfm:
  api_key: "your-lastfm-api-key"            # https://www.last.fm/api/account/create
  api_secret: "your-lastfm-shared-secret"
  username: "your-lastfm-username"
  # password_hash: "md5-of-your-password"   # run: python3 -c "import hashlib; print(hashlib.md5(b'YOUR_PASSWORD').hexdigest())"
  # session_key: ""                         # preferred: a Last.fm web-service session key (no password hash on disk)

audio:
  device: "plughw:CARD=Device,DEV=0"        # find yours: arecord -l
  sample_rate: 44100
  channels: 2                               # stereo — important for ShazamIO accuracy
  chunk_duration: 6                          # seconds of audio in each fingerprint window
  # capture_gain_db: 20                      # ALSA capture gain set at start (amixer); a USB mic
  #                                          # input at full gain clips a line-level turntable
  # mixer_control: "Mic"                     # the simple control that carries that gain

fingerprint:
  shazam_fallback: true                     # ShazamIO: the recogniser (asked first; the name is historical)
  acoustid_fallback: false                  # AcoustID as a second try. Chromaprint matches a track from
                                            # its start, so a window from the middle rarely does
  acoustid_timeout: 10                      # seconds, when it is on
  min_confidence: 0.5                       # AcoustID only

catalogue:
  deezer_fallback: true                     # names, track lengths and album tracklists come from Spotify
                                            # when it has credentials and answers; Deezer (no key) steps in
                                            # when Spotify is rate limited, down or has nothing
  # corrections: "corrections.yaml"         # manual fixes, relative to this file (default ~/spindle/corrections.yaml)

scrobble:
  min_play_seconds: 30                      # Last.fm 30-second rule
  min_play_fraction: 0.5                    # or 50% of track length
  now_playing: true

silence:
  threshold_db: -45                         # line-level USB capture: idle floor is ~-50 dB
  min_silence_seconds: 8                    # quiet this long = side over (run-out groove)
  start_margin_db: 6                        # music must clear threshold + margin to start a session
  start_ticks: 2                            # ... for this many 2 s ticks (run-out noise sits at the threshold)

web:
  enabled: false                            # the touch display: Spindle serves it at http://127.0.0.1:8787/
  host: "127.0.0.1"                         # and a kiosk browser shows it (see README "The display")
  port: 8787
  # remote_key: ""                          # a long random string turns the phone remote on:
  #                                         # GET|POST /api/ui/<command>?k=<key> (and /api/debug/*).
  #                                         # Reaching it from a phone needs host 0.0.0.0 or a tailnet
  #                                         # address; keep the port off networks you do not trust

display:
  enabled: false                            # the framebuffer fallback for a plain HDMI panel or the Waveshare
  fb_path: "/dev/fb0"                       # LCD; keep it off when the kiosk owns the screen (fb0 writes vanish)

discogs:
  token: ""                                 # personal access token (discogs.com/settings/developers)
  username: ""                              # your collection = the records on the shelf: it decides which
                                            # album a track belongs to, locks albums Spotify lacks, and
                                            # gives the screen "A3 · SIDE A" and side boundaries

art:
  itunes: true                              # 1200 px covers from Apple's catalog
  deezer: true                              # has the explicit albums Apple's search hides

telegram:                                   # the log channel: one card per start, errors, warning digests
  bot_token: ""                             # from @BotFather
  chat_id: ""                               # your chat ID (get from @userinfobot)
  silent: true                              # post without a notification sound
  errors: true                              # post errors and warning digests

logging:
  file: ""                                  # e.g. /home/pi/spindle/spindle.log
  max_bytes: 5000000                        # 5 MB per file
  backup_count: 3                           # keep 3 rotated log files
